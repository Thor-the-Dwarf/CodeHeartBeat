id: worksheet.uml-activity-prototype
type: component
path: UML-Aufgabenblaetter/index.html
what: 'Stellt ein eigenständiges UML-Aufgabenblatt mit prüfungsnahem Aufgabentext, interaktivem Aktivitätsdiagramm-Editor und einer rechts neben dem Diagramm eingeblendeten Strukturauswertung mehrerer Musterlösungen bereit.'
why: 'Die direkt startbare Einzeldatei bewertet Elementtypen und Verbindungen unabhängig von Beschriftung und Anordnung; die horizontal scrollbar angeordneten Arbeitsbereiche halten Aufgabe, Diagramm und Ergebnis gleichzeitig vergleichbar, ohne den Editor zu überlagern.'
depends_on:
  - diagram-builder.workspace
  - diagram-builder.element-catalog
  - diagram-builder.connection-routing
