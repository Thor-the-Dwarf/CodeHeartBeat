id: worksheet.uml-activity-prototype
type: component
path: UML-Aufgabenblaetter/index.html
what: 'Stellt ein eigenständiges UML-Aufgabenblatt mit prüfungsnahem Aufgabentext und einem interaktiven Aktivitätsdiagramm-Editor bereit.'
